                                            try {
                                                const logEntry = {
                                                    staffName: newLogStaff.trim(),
                                                    category: newLogCategory,
                                                    priority: newLogPriority,
                                                    title: newLogTitle.trim(),
                                                    note: newLogNote,
                                                    linkedItems: newLog.linkedItems || [],
                                                    photo: newLogCategory === 'issue' ? (shiftLogPhotoFile || null) : null,
                                                    date: new Date().toISOString(),
                                                    timestamp: Date.now(),
                                                    completed: false
                                                };
                                                await window.db.collection('shiftLogs').add(logEntry);
                                                // Reset
                                                setNewLogStaff('');
                                                setNewLogCategory('general');
                                                setNewLogPriority('low');
                                                setNewLogTitle('');
                                                setNewLogNote('');
                                                setNewLog({staffName: '', selling: '', requests: '', priceFeedback: '', issues: '', linkedItems: []});
                                                setItemSearchQuery('');
                                                setShiftLogPhotoFile(null);
                                                setShiftLogPhotoPreview(null);
                                                setShowAddLog(false);
                                                alert('✅ Shift log saved!');
                                            } catch(error) {
                                                alert('❌ Failed to save: ' + error.message);
                                            }
                                        }}
                                        style={{ background: '#4caf50', color: 'white', border: 'none', padding: '0.75rem 1.5rem', borderRadius: '6px', cursor: 'pointer', fontWeight: '600', fontSize: '1rem' }}

                                        ✓ Save Log
                                    </button>
                                    <button
                                        onClick={() => {
                                            setNewLogStaff(''); setNewLogCategory('general'); setNewLogPriority('low');
                                            setNewLogTitle(''); setNewLogNote('');
                                            setNewLog({staffName: '', selling: '', requests: '', priceFeedback: '', issues: '', linkedItems: []});
                                            setItemSearchQuery(''); setShiftLogPhotoFile(null); setShiftLogPhotoPreview(null);
                                            setShowAddLog(false);
                                        }}
                                        style={{ background: '#666', color: 'white', border: 'none', padding: '0.75rem 1.5rem', borderRadius: '6px', cursor: 'pointer' }}

                                        Cancel
                                    </button>

                        {/* Filter bar */}
                        {/* Open / Completed tabs */}
                        <div style={{ display: 'flex', marginBottom: '1rem', borderRadius: '8px', overflow: 'hidden', border: '2px solid #e0e0e0' }}>
                            <button
                                onClick={() => setShiftLogShowCompleted(false)}
                                style={{ flex: 1, padding: '0.65rem 1rem', border: 'none', cursor: 'pointer', fontWeight: '700', fontSize: '0.9rem', background: !shiftLogShowCompleted ? 'var(--primary-orange)' : '#f5f5f5', color: !shiftLogShowCompleted ? 'white' : '#666', borderRight: '1px solid #e0e0e0' }}
                            >
                                🔔 Open ({logs.filter(l => !l.completed).length})
                            </button>
                            <button
                                onClick={() => setShiftLogShowCompleted(true)}
                                style={{ flex: 1, padding: '0.65rem 1rem', border: 'none', cursor: 'pointer', fontWeight: '700', fontSize: '0.9rem', background: shiftLogShowCompleted ? '#4caf50' : '#f5f5f5', color: shiftLogShowCompleted ? 'white' : '#666' }}
                            >
                                ✅ Completed ({logs.filter(l => l.completed).length})
                            </button>
                        </div>

                        <div style={{ background: '#f5f5f5', padding: '0.75rem 1rem', borderRadius: '8px', marginBottom: '1rem', display: 'flex', gap: '0.5rem', flexWrap: 'wrap', alignItems: 'center' }}>
                            {/* Category filter */}
                            <select value={shiftLogFilter} onChange={e => setShiftLogFilter(e.target.value)}
                                style={{ padding: '0.4rem 0.6rem', border: '1px solid #ddd', borderRadius: '6px', fontSize: '0.85rem' }}>
                                <option value="all">All Categories</option>
                                {Object.entries(CATEGORIES).map(([key, cat]) => (
                                    <option key={key} value={key}>{cat.emoji} {cat.label}</option>
                                ))}
                            </select>

                            <select value={shiftLogPriorityFilter} onChange={e => setShiftLogPriorityFilter(e.target.value)}
                                style={{ padding: '0.4rem 0.6rem', border: '1px solid #ddd', borderRadius: '6px', fontSize: '0.85rem' }}>

                                <option value="high">🔴 High</option>
                                <option value="medium">🟡 Medium</option>
                                <option value="low">⚪ Low</option>

                                <select value={shiftLogStaffFilter} onChange={e => setShiftLogStaffFilter(e.target.value)}

                                </select>

                            </div>

                            <div style={{ display: 'grid', gap: '0.75rem' }}>
                                {filteredLogs.map((log, index) => {
                                    const cat = CATEGORIES[log.category] || CATEGORIES.general;
                                    const pri = PRIORITIES[log.priority || 'low'];
                                    const logDate = new Date(log.date);
                                    const isToday = logDate.toDateString() === new Date().toDateString();
                                    const dateStr = isToday ? `Today ${logDate.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'})}` :
                                        logDate.toLocaleDateString('en-GB', {weekday:'short', day:'2-digit', month:'short'}) + ' ' + logDate.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
                                    
                                    // Legacy logs might not have new fields
                                    const title = log.title || log.selling || log.issues || log.requests || 'Shift Log Entry';
                                    const note = log.note || [log.selling && `Selling: ${log.selling}`, log.requests && `Requests: ${log.requests}`, log.priceFeedback && `Price feedback: ${log.priceFeedback}`, log.issues && `Issues: ${log.issues}`].filter(Boolean).join('\n') || '';

                                    return (
                                        <div
                                            key={log.id || index}
                                            style={{
                                                background: log.completed ? '#fafafa' : 'white',
                                                borderRadius: '10px',
                                                border: `1px solid ${log.completed ? '#ddd' : cat.color + '40'}`,
                                                borderLeft: `5px solid ${log.completed ? '#ccc' : cat.color}`,
                                                padding: '1rem',
                                                opacity: log.completed ? 0.7 : 1
                                            }}
                                        >
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '0.5rem', flexWrap: 'wrap' }}>
                                                <div style={{ flex: 1 }}>
                                                    {/* Category + Priority badges */}
                                                    <div style={{ display: 'flex', gap: '0.5rem', alignItems: 'center', marginBottom: '0.4rem', flexWrap: 'wrap' }}>
                                                        <span style={{ background: log.completed ? '#e0e0e0' : cat.color, color: 'white', padding: '0.2rem 0.5rem', borderRadius: '10px', fontSize: '0.75rem', fontWeight: '700' }}>
                                                            {cat.emoji} {cat.label}
                                                        </span>
                                                        <span style={{ color: pri.color, fontSize: '0.8rem', fontWeight: '600' }}>
                                                            {pri.emoji} {pri.label}
                                                        </span>
                                                        {index === 0 && !log.completed && (
                                                            <span style={{ background: '#ff5722', color: 'white', padding: '0.15rem 0.4rem', borderRadius: '8px', fontSize: '0.7rem', fontWeight: '700' }}>🔴 LATEST</span>
                                                        )}
                                                        {log.completed && <span style={{ color: '#4caf50', fontSize: '0.8rem', fontWeight: '600' }}>✅ Done</span>}
                                                    </div>
                                                    {/* Title */}
                                                    <div style={{ fontWeight: '700', fontSize: '1rem', color: '#222', marginBottom: '0.3rem' }}>
                                                        {log.completed ? '✅ ' : ''}{title}
                                                    </div>
                                                    {/* Note */}
                                                    {note && (
                                                        <div style={{ fontSize: '0.875rem', color: '#555', marginBottom: '0.4rem', whiteSpace: 'pre-line', lineHeight: '1.5' }}>
                                                            {note}
                                                        </div>
                                                    )}
                                                    {/* Linked items */}
                                                    {log.linkedItems && log.linkedItems.length > 0 && (
                                                        <div style={{ display: 'flex', gap: '0.4rem', flexWrap: 'wrap', marginBottom: '0.4rem' }}>
                                                            {log.linkedItems.map(itemId => {
                                                                const item = items.find(i => i.id === itemId);
                                                                return item ? (
                                                                    <span key={itemId} style={{ background: '#e3f2fd', color: '#1565c0', padding: '0.15rem 0.4rem', borderRadius: '8px', fontSize: '0.75rem', fontWeight: '600' }}>
                                                                        🔗 {item.name}
                                                                    </span>
                                                                ) : null;
                                                            })}
                                                        </div>
                                                    )}
                                                    {/* Photo */}
                                                    {log.photo && (
                                                        <img src={log.photo} alt="Issue photo" style={{ maxWidth: '200px', maxHeight: '150px', borderRadius: '6px', border: '2px solid #ddd', marginBottom: '0.4rem', cursor: 'pointer' }}
                                                            onClick={() => window.open(log.photo, '_blank')} />
                                                    )}
                                                    {/* Meta */}
                                                    <div style={{ fontSize: '0.78rem', color: '#999' }}>
                                                        {log.staffName} • {dateStr}
                                                        {log.completedBy && ` • Completed by ${log.completedBy}`}
                                                    </div>
                                                </div>
                                                {/* Action buttons */}
                                                <div style={{ display: 'flex', gap: '0.4rem', flexShrink: 0 }}>
                                                    <button
                                                        onClick={async () => {
                                                            try {
                                                                const newCompleted = !log.completed;
                                                                await window.db.collection('shiftLogs').doc(log.id).update({
                                                                    completed: newCompleted,
                                                                    completedBy: newCompleted ? 'Staff' : null,
                                                                    completedDate: newCompleted ? new Date().toISOString() : null
                                                                });
                                                            } catch(e) { alert('Error: ' + e.message); }
                                                        }}
                                                        style={{ background: log.completed ? '#bdbdbd' : '#4caf50', color: 'white', border: 'none', padding: '0.4rem 0.6rem', borderRadius: '6px', cursor: 'pointer', fontSize: '0.8rem', fontWeight: '600' }}
                                                        title={log.completed ? 'Mark as open' : 'Mark as done'}
                                                    >
                                                        {log.completed ? '↩️' : '✅'}
                                                    </button>
                                                    <button
                                                        onClick={async () => {
                                                            if (confirm('Delete this log entry?')) {
                                                                try { await window.db.collection('shiftLogs').doc(log.id).delete(); }
                                                                catch(e) { alert('Error: ' + e.message); }
                                                            }
                                                        }}
                                                        style={{ background: '#f44336', color: 'white', border: 'none', padding: '0.4rem 0.6rem', borderRadius: '6px', cursor: 'pointer', fontSize: '0.8rem' }}
                                                        title="Delete"
                                                    >
                                                        🗑️
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* Unlogged Deliveries Section */}
                        {(() => {
                            const unloggedItems = deliveryHistory.filter(d => d.unloggedOrder === true);
                            if (unloggedItems.length === 0) return null;
                            const seen = {};
                            unloggedItems.forEach(d => {
                                if (!seen[d.itemId] || d.deliveredDate > seen[d.itemId].deliveredDate) seen[d.itemId] = d;
                            });
                            const grouped = Object.values(seen).sort((a,b) => (b.deliveredDate||'').localeCompare(a.deliveredDate||''));
                            return (
                                <div style={{ marginTop:'2rem', paddingTop:'1.5rem', borderTop:'2px dashed #ff9800' }}>
                                    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom: showUnloggedDeliveries ? '1rem' : 0 }}>
                                        <div style={{ display:'flex', alignItems:'center', gap:'0.6rem', cursor:'pointer' }} onClick={() => setShowUnloggedDeliveries(!showUnloggedDeliveries)}>
                                            <span style={{ fontSize:'1.1rem' }}>{showUnloggedDeliveries ? '▼' : '▶'}</span>
                                            <span style={{ fontWeight:'700', fontSize:'1rem' }}>⚠️ Unlogged Deliveries</span>
                                            <span style={{ background:'#ff9800', color:'white', fontSize:'0.72rem', fontWeight:'800', padding:'2px 8px', borderRadius:'10px' }}>{grouped.length}</span>
                                        </div>
                                        <div style={{ fontSize:'0.78rem', color:'#888' }}>Arrived without a prior order</div>
                                    </div>
                                    {showUnloggedDeliveries && (

                // ── Email paste parser ──────────────────────────────────────
                const parseEmailPaste = async () => {
                    // Load saved name mappings
                    let savedMappings = {};
                    try {
                        const snap = await window.db.collection('settings').doc('emailNameMappings').get();
                        if (snap.exists) savedMappings = snap.data().mappings || {};
                    } catch(e) {}
                    const lines = emailPasteText.split('\n').map(l => l.trim()).filter(Boolean);
                    const parsed = [];
                    lines.forEach(line => {
                        // Try multiple formats:
                        // "* Item Name - x500", "Item Name x500", "Item Name: 500", "500 x Item Name", "Item Name (500)"
                        let rawName = '', qty = 0;
                        const patterns = [
                            /^[*•\-]?\s*(.+?)\s*[-–:]\s*[xX]?\s*(\d+)\s*$/,   // * Name - x500
                            /^[*•\-]?\s*(.+?)\s+[xX](\d+)\s*$/,                  // Name x500
                            /^[*•\-]?\s*(.+?)\s+(\d+)\s*(?:units?|pcs?)?\s*$/,  // Name 500 units
                            /^[*•\-]?\s*(\d+)\s*[xX]?\s*(.+?)\s*$/,             // 500 x Name
                            /^[*•\-]?\s*(.+?)\s*\((\d+)\)\s*$/,               // Name (500)
                        ];
                        for (const pat of patterns) {
                            const m = line.match(pat);
                            if (m) {
                                // Check if first group is number (reversed format)
                                if (pat.toString().includes('(\\d+)\\s*[xX]?\\s*(.+?)')) {
                                    qty = parseInt(m[1]); rawName = m[2].trim();
                                } else {
                                    rawName = m[1].trim().replace(/^[*•\-]\s*/,''); qty = parseInt(m[2]);
                                }
                                if (rawName && qty > 0) break;
                            }
                        }
                        if (!rawName || !qty) return;
                        const rawLower = rawName.toLowerCase();
                        // 0. Check saved name mappings first
                        const savedId = savedMappings[rawLower] || savedMappings[rawName.toLowerCase()];
                        let match = savedId ? items.find(i => i.id === savedId) : null;
                        // 1. Exact supplier product name match
                        if (!match) match = items.find(i => i.supplierProductName && i.supplierProductName.trim().toLowerCase() === rawLower);
                        // 2. Exact internal name match
                        if (!match) match = items.find(i => i.name.toLowerCase() === rawLower);
                        // 3. Internal name contains raw name
                        if (!match) match = items.find(i => i.name.toLowerCase().includes(rawLower));
                        // 4. Raw name contains internal name (min 5 chars)
                        if (!match) match = items.find(i => i.name.length >= 5 && rawLower.includes(i.name.toLowerCase()));
                        // 5. Partial word match - first 3 significant words
                        if (!match) {
                            const rawWords = rawLower.split(/\s+/).filter(w => w.length > 3);
                            match = items.find(i => {
                                const nameWords = i.name.toLowerCase().split(/\s+/).filter(w => w.length > 3);
                                return rawWords.length > 0 && nameWords.length > 0 &&
                                    rawWords.filter(w => nameWords.some(nw => nw.startsWith(w.substring(0,5)) || w.startsWith(nw.substring(0,5)))).length >= Math.min(2, rawWords.length);
                            });
                        }
                        parsed.push({ rawName, qty, matchedItem: match || null, confirmed: !!match, manualId: match?.id || null });

                                                const snap = await window.db.collection('settings').doc('supplierTemplates').get();

                                    </div>
                                </div>
                            </div>

                                </div>
                            </div>

                                            <label style={{ display:'block', fontWeight:'600', marginBottom:'0.35rem', fontSize:'0.88rem' }}>Email body</label>
                                            <textarea value={emailPasteText} onChange={e => setEmailPasteText(e.target.value)}
                                                placeholder={'Paste your order email here...\n\n* Item Name - x100\n* Another Item - x50'}

                                            <div style={{ display:'flex', gap:'0.75rem', marginTop:'1rem' }}>
                                                <button onClick={() => { setShowEmailPasteModal(false); setEmailPasteText(''); setEmailPasteSupplier(''); }}
                                                    style={{ flex:1, padding:'0.75rem', background:'#f5f5f5', border:'none', borderRadius:'8px', cursor:'pointer', fontWeight:'600' }}>Cancel</button>
                                                <button onClick={parseEmailPaste} disabled={!emailPasteText.trim()}
                                                    style={{ flex:2, padding:'0.75rem', background: emailPasteText.trim() ? '#1a1a1a' : '#ccc', color:'white', border:'none', borderRadius:'8px', cursor: emailPasteText.trim() ? 'pointer' : 'not-allowed', fontWeight:'700' }}>
                                                    Parse & Review →
                                                </button>
                                            </div>
                                        </>
                                    ) : (
                                        <>
                                            <h3 style={{ marginBottom:'0.4rem' }}>Review Matches</h3>
                                            <p style={{ fontSize:'0.82rem', color:'#888', marginBottom:'1rem' }}>Check each item match. Uncheck any you want to skip.</p>
                                            {emailPasteMatches.length === 0 && (
                                                <div style={{ padding:'1.25rem', background:'#fff8e1', borderRadius:'8px', border:'1px solid #ffe082', marginBottom:'1rem', fontSize:'0.85rem', color:'#666' }}>

                                                    <code style={{ background:'#f5f5f5', padding:'2px 6px', borderRadius:'4px', fontSize:'0.82rem' }}>* Item Name - x100</code>
                                                </div>
                                            )}
                                            <div style={{ border:'1px solid #e8e8e8', borderRadius:'8px', overflow:'hidden', marginBottom:'1rem' }}>

                                                    <div key={idx} style={{ padding:'0.75rem 1rem', borderBottom: idx < emailPasteMatches.length-1 ? '1px solid #f5f5f5' : 'none', display:'flex', alignItems:'center', gap:'0.75rem' }}>
                                                        <input type="checkbox" checked={entry.confirmed}
                                                            onChange={e => { const m = [...emailPasteMatches]; m[idx].confirmed = e.target.checked; setEmailPasteMatches(m); }}
                                                            style={{ width:'18px', height:'18px', flexShrink:0, cursor:'pointer' }} />
                                                        <div style={{ flex:1, minWidth:0 }}>
                                                            <div style={{ fontSize:'0.85rem', color:'#888' }}>"{entry.rawName}" × {entry.qty}</div>
                                                            {entry.matchedItem ? (
                                                                <div style={{ fontWeight:'600', fontSize:'0.9rem', color:'#2e7d32' }}>✅ {entry.matchedItem.name}</div>
                                                            ) : (
                                                                <div>
                                                                    <select onChange={e => { const m=[...emailPasteMatches]; const found=items.find(i=>i.id===e.target.value); m[idx].matchedItem=found||null; m[idx].manualId=e.target.value||null; m[idx].confirmed=!!found; setEmailPasteMatches(m); }}

                                                                        <option value="">⚠️ No match — select manually</option>
                                                                        {items.filter(i => i.supplier === emailPasteSupplier || !emailPasteSupplier).map(i => <option key={i.id} value={i.id}>{i.name}</option>)}
                                                                    </select>
                                                                    {emailPasteMatches[idx]?.matchedItem && (
                                                                        <label style={{ display:'flex', alignItems:'center', gap:'5px', marginTop:'5px', cursor:'pointer', fontSize:'0.78rem', color:'#555' }}>
                                                                            <input type="checkbox" onChange={async e => {
                                                                                if (!e.target.checked || !emailPasteMatches[idx]?.matchedItem) return;
                                                                                const rawN = entry.rawName.toLowerCase().trim();
                                                                                const itemId = emailPasteMatches[idx].matchedItem.id;
                                                                                try {
                                                                                    const snap = await window.db.collection('settings').doc('emailNameMappings').get();
                                                                                    const existing = snap.exists ? (snap.data().mappings || {}) : {};
                                                                                    await window.db.collection('settings').doc('emailNameMappings').set({ mappings: { ...existing, [rawN]: itemId } });
                                                                                } catch(e) { console.error(e); }
                                                                            }} style={{ cursor:'pointer' }} />
                                                                            Remember: "{entry.rawName}" = {emailPasteMatches[idx].matchedItem.name}
                                                                        </label>
                                                                    )}
                                                                </div>
                                                            )}
                                                        </div>
                                                        <div style={{ flexShrink:0, fontWeight:'700', fontSize:'0.9rem', color:'#1a1a1a' }}>×{entry.qty}</div>
                                                    </div>
                                                ))}
                                            </div>
                                            <div style={{ display:'flex', gap:'0.75rem' }}>
                                                <button onClick={() => setShowEmailPasteReview(false)}
                                                    style={{ flex:1, padding:'0.75rem', background:'#f5f5f5', border:'none', borderRadius:'8px', cursor:'pointer', fontWeight:'600' }}>← Back</button>
                                                <button onClick={confirmEmailPasteOrder}

                                                    ✅ Log {emailPasteMatches.filter(e=>e.confirmed).length} items as Ordered
                                                </button>
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* ── NOTES / DRAFT ORDERS ──────────────────────── */}
                        <div style={{ marginBottom:'2rem', paddingBottom:'1.5rem', borderBottom:'2px dashed #e8e8e8' }}>
                            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'0.85rem' }}>
                                <div>
                                    <div style={{ fontWeight:'700', fontSize:'1rem', color:'#5c3d8f' }}>📋 Draft Orders &amp; Notes</div>
                                    <div style={{ fontSize:'0.78rem', color:'#888', marginTop:'2px' }}>Items you want to order — not yet sent</div>
                                </div>
                                <button onClick={() => setShowEmailPasteModal(true)}
                                    style={{ padding:'6px 12px', background:'#f0f7ff', border:'1px solid #bbdefb', borderRadius:'7px', color:'#1565c0', fontWeight:'700', fontSize:'0.78rem', cursor:'pointer' }}>

                                </button>
                            </div>

                            {/* Log Order search */}
                            <div style={{ position:'relative', marginBottom:'0.75rem' }}>
                                <div onClick={() => { setLogModalSearch(''); setLogModalItem(null); setLogSupplierFilter('all'); setLogOrderQueue([]); setLogOrderForm({ qtyOrdered:'', dateOrdered: new Date().toISOString().split('T')[0], notes:'' }); setShowLogOrderModal(true); }}
                                    style={{ width:'100%', padding:'0.65rem 1rem', background:'#fafafa', border:'1.5px solid #d0d0d0', borderRadius:'8px', cursor:'pointer', display:'flex', alignItems:'center', gap:'0.65rem', color:'#666', fontSize:'0.9rem', boxSizing:'border-box', transition:'border-color 0.15s' }}>
                                    <span>📦</span><span style={{ fontStyle:'italic' }}>Log an order...</span>
                                </div>
                            </div>



                            {/* Pending items */}
                            {manualPendingItems.length > 0 && (
                                <div style={{ marginTop:'0.75rem', border:'1px solid #e8e8e8', borderRadius:'8px', overflow:'hidden' }}>
                                    {manualPendingItems.map((item, idx) => (
                                        <div key={item.id} style={{ display:'flex', alignItems:'center', gap:'0.75rem', padding:'0.65rem 0.85rem', borderBottom: idx < manualPendingItems.length-1 ? '1px solid #f5f5f5' : 'none', background:'white' }}>
                                            <div style={{ flex:1, minWidth:0 }}>
                                                <div style={{ fontWeight:'600', fontSize:'0.88rem' }}>{item.name}</div>
                                                <div style={{ fontSize:'0.75rem', color:'#888' }}>{item.supplier} · qty: {item.quantityToOrder || 0}</div>
                                            </div>
                                            <button onClick={async () => {
                                                await window.db.collection('reorderList').doc(item.id).update({ orderStatus:'ordered', orderDate: new Date().toISOString() });
                                                await logActivity('mark_ordered', 'Marked as ordered: ' + item.name, { itemId: item.id });
                                            }} style={{ padding:'4px 10px', background:'#e8f5e9', color:'#2e7d32', border:'1px solid #c8e6c9', borderRadius:'6px', fontWeight:'700', fontSize:'0.75rem', cursor:'pointer', whiteSpace:'nowrap' }}>
                                                Mark Ordered
                                            </button>
                                            <button onClick={async () => { if(confirm('Remove from draft?')) await window.db.collection('reorderList').doc(item.id).delete(); }}
                                                style={{ padding:'4px 8px', background:'none', border:'none', color:'#ccc', cursor:'pointer', fontSize:'1rem' }}>✕</button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* ── ORDERED ──────────────────────────────────────── */}
                        <div style={{ marginBottom:'2rem', paddingBottom:'1.5rem', borderBottom:'2px dashed #e8e8e8' }}>
                            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'0.85rem', cursor:'pointer' }}
                                onClick={() => setManualOrderedExpanded(!manualOrderedExpanded)}>
                                <div style={{ display:'flex', alignItems:'center', gap:'0.6rem' }}>
                                    <span>{manualOrderedExpanded ? '▼' : '▶'}</span>
                                    <div>
                                        <div style={{ fontWeight:'700', fontSize:'1rem', color:'#1565c0' }}>📦 Ordered — Awaiting Delivery</div>
                                        <div style={{ fontSize:'0.78rem', color:'#888', marginTop:'2px' }}>Items ordered, waiting to arrive</div>
                                    </div>
                                </div>
                                <div style={{ display:'flex', alignItems:'center', gap:'8px' }} onClick={e => e.stopPropagation()}>
                                    {manualOrderedItems.length > 0 && <span style={{ background:'#2196f3', color:'white', fontSize:'0.72rem', fontWeight:'800', padding:'2px 8px', borderRadius:'10px' }}>{manualOrderedItems.length}</span>}
                                    <button onClick={() => { setLogModalSearch(''); setLogModalItem(null); setLogSupplierFilter('all'); setLogOrderQueue([]); setLogOrderForm({ qtyOrdered:'', dateOrdered: new Date().toISOString().split('T')[0], notes:'' }); setShowLogOrderModal(true); }}
                                        style={{ padding:'4px 10px', background:'#e3f2fd', color:'#1565c0', border:'1px solid #bbdefb', borderRadius:'6px', fontWeight:'700', fontSize:'0.75rem', cursor:'pointer' }}>
                                        + Log Order
                                    </button>
                                </div>
                            </div>

                            {manualOrderedExpanded && (
                                <div>
                                    {manualOrderedItems.length === 0 ? (
                                        <div style={{ textAlign:'center', padding:'1.5rem', color:'#aaa', fontSize:'0.88rem', background:'#fafafa', borderRadius:'8px' }}>No items currently ordered</div>
                                    ) : (
                                        (() => {
                                            const grouped = {};
                                            manualOrderedItems.forEach(item => {
                                                const sup = item.supplier || '❓ No Supplier';
                                                if (!grouped[sup]) grouped[sup] = [];
                                                grouped[sup].push(item);
                                            });
                                            const suppliers = Object.keys(grouped).sort((a,b) => a==='❓ No Supplier'?1:b==='❓ No Supplier'?-1:a.localeCompare(b));
                                            return suppliers.map(sup => {
                                                const supItems = grouped[sup];
                                                const isExpanded = expandedSuppliers['ordered_' + sup] !== false;
                                                const allSelected = supItems.every(i => selectedOrderIds.has(i.id));
                                                return (
                                                    <div key={sup} style={{ marginBottom:'0.85rem', border:'2px solid #e3f2fd', borderRadius:'10px', overflow:'hidden' }}>

                                                        <div style={{ padding:'0.75rem 1rem', background:'#f0f7ff', display:'flex', alignItems:'center', justifyContent:'space-between', cursor:'pointer', userSelect:'none' }}

                                                            </div>

                                                                <button onClick={() => { setTemplateDraft(supplierTemplates[sup]||''); setEditingTemplate(sup); }}
                                                                    style={{ background: supplierTemplates[sup]?'#fff8e1':'white', color:supplierTemplates[sup]?'#e65100':'#999', border:'1px solid #e0e0e0', padding:'3px 8px', borderRadius:'5px', fontSize:'0.72rem', cursor:'pointer', fontWeight:'600' }}>

                                    <p style={{ fontSize: '0.85rem', color: '#666', marginTop: '0.25rem' }}>
                                        Alert when stock reaches or drops below this number
                                    </p>
                                </div>
                                
                                <div style={{ marginBottom: '1.5rem' }}>
                                    <label style={{ display: 'block', marginBottom: '0.5rem', fontWeight: '600', color: '#ff9800' }}>
                                        🟡 Warning Level (consider ordering)
                                    </label>
                                    <input
                                        type="number"
                                        min={alertValues.critical}
                                        value={alertValues.warning}
                                        onChange={(e) => setAlertValues({...alertValues, warning: parseInt(e.target.value) || 0})}
                                        style={{
                                            width: '100%',
                                            padding: '0.75rem',
                                            border: '2px solid #ddd',
                                            borderRadius: '6px',
                                            fontSize: '1rem'
                                        }}
                                    />
                                    <p style={{ fontSize: '0.85rem', color: '#666', marginTop: '0.25rem' }}>
                                        Alert when stock reaches this level (must be ≥ critical level)
                                    </p>
                                </div>
                                
                                <div style={{ 
                                    padding: '1rem',
                                    background: '#f5f5f5',
                                    borderRadius: '6px',
                                    marginBottom: '1.5rem'
                                }}>
                                    <p style={{ fontSize: '0.9rem', margin: 0 }}>
                                        <strong>Current stock:</strong> {editingAlertItem.quantity || 0}
                                        <br/>
                                        <strong>Status:</strong> {
                                            (editingAlertItem.quantity || 0) <= alertValues.critical ? '🔴 Would be CRITICAL' :
                                            (editingAlertItem.quantity || 0) <= alertValues.warning ? '🟡 Would show WARNING' :
                                            '🟢 Would be GOOD'
                                        }
                                    </p>
                                </div>
                                
                                <div style={{ display: 'flex', gap: '1rem' }}>
                                    <button
                                        onClick={async () => {
                                            if (alertValues.warning < alertValues.critical) {
                                                alert('Warning level must be greater than or equal to critical level');
                                                return;
                                            }
                                            await saveItemToFirebase({
                                                ...editingAlertItem,
                                                criticalLevel: alertValues.critical,
                                                warningLevel: alertValues.warning
                                            });
                                            setEditingAlertItem(null);
                                            alert('✅ Alert thresholds saved!');
                                        }}
                                        style={{
                                            flex: 1,
                                            background: '#4caf50',
                                            color: 'white',
                                            border: 'none',
                                            padding: '0.75rem',
                                            borderRadius: '6px',
                                            cursor: 'pointer',
                                            fontWeight: '600'
                                        }}
                                    >
                                        ✓ Save Thresholds
                                    </button>
                                    <button
                                        onClick={() => setEditingAlertItem(null)}
                                        style={{
                                            flex: 1,
                                            background: '#666',
                                            color: 'white',
                                            border: 'none',
                                            padding: '0.75rem',
                                            borderRadius: '6px',
                                            cursor: 'pointer'
                                        }}
                                    >
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '0.5rem' }}>
                                    <p style={{ fontSize: '0.9rem', margin: 0 }}>Storage Management</p>
                                    <span style={{
                                        background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                                        color: 'white',
                                        padding: '0.15rem 0.5rem',
                                        borderRadius: '12px',
                                        fontSize: '0.7rem',
                                        fontWeight: '700',
                                        letterSpacing: '0.5px'
                                    }}> V5.4 </span>
                                </div>
                            </div>
                            <button onClick={() => { if(window.confirm('Log out?')) window.logout(); }}
                                style={{ background: 'rgba(255,255,255,0.15)', border: '1px solid rgba(255,255,255,0.3)', color: 'white', padding: '0.35rem 0.75rem', borderRadius: '8px', cursor: 'pointer', fontSize: '0.78rem', fontWeight: '600' }}>
                                🔒 Logout
                            </button>
                        </div>
                    </header>

                    <nav className="nav">
                        <button
                            className={`nav-button ${currentPage === 'search' ? 'active' : ''}`}
                            onClick={() => setCurrentPage('search')}
                        >
                            🔍 Search & Find
                        </button>
                        <button
                            className={`nav-button ${currentPage === 'count' ? 'active' : ''}`}
                            onClick={() => setCurrentPage('count')}
                        >
                            📊 Stock Count
                        </button>

                        <button
                            className={`nav-button ${currentPage === 'reorder' ? 'active' : ''}`}
                            onClick={() => setCurrentPage('reorder')}
                        >
                            📋 Reorder
                        </button>
                        <button
                            className={`nav-button ${currentPage === 'shiftlog' ? 'active' : ''}`}
                            onClick={() => setCurrentPage('shiftlog')}
                        >
                            📋 Shift Log
                        </button>
                        
                                                <button
                                className={`nav-btn ${currentPage === 'firebase' ? 'active' : ''}`}
                                onClick={() => setCurrentPage('firebase')}
                            >
                                <span className="nav-icon">🔥</span>
                                <span className="nav-label">Firebase</span>
                            </button>
                        </nav>

                    <main className="content">
                        {currentPage === 'search' && renderSearch()}
                        {/* Storage Map removed - code preserved in V4.9.6-FINAL for future use */}
                        {currentPage === 'count' && renderStockCount()}
                        {currentPage === 'shiftlog' && renderShiftLog()}
                        {currentPage === 'reorder' && renderReorder()}
                        
                        {currentPage === 'firebase' && renderFirebasePage()}
                    </main>
                    
                    {/* Floating Add Item Button */}
                    <button
                        onClick={() => setShowAddItemModal(true)}
                        style={{
                            position: 'fixed',
                            bottom: '2rem',
                            right: '2rem',
                            width: '60px',
                            height: '60px',
                            borderRadius: '50%',
                            background: '#ff9800',
                            color: 'white',
                            border: 'none',
                            fontSize: '2rem',
                            cursor: 'pointer',
                            boxShadow: '0 4px 12px rgba(0,0,0,0.3)',
                            zIndex: 1000
                        }}
                        title="Add New Item"
                    >
                        +
                    </button>
                    
                    {/* Add Item Modal */}
                    {showAddItemModal && (
                        <div style={{
                            position: 'fixed',
                            top: 0,
                            left: 0,
                            right: 0,
                            bottom: 0,
                            background: 'rgba(0,0,0,0.7)',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            zIndex: 2000,
                            padding: '1rem'
                        }}>
                            <div style={{
                                background: 'white',
                                borderRadius: '12px',
                                padding: '2rem',
                                maxWidth: '600px',
                                width: '100%',
                                maxHeight: '90vh',
                                overflow: 'auto'
                            }}>
                                <h2 style={{marginBottom: '1.5rem', color: '#333'}}>➕ Add New Item</h2>
                                
                                <div style={{display: 'flex', flexDirection: 'column', gap: '1rem'}}>
                                    <div>
                                        <label style={{display: 'block', marginBottom: '0.5rem', fontWeight: '600', color: '#555'}}>
                                            Item Name *
                                        </label>
                                        <input
                                            type="text"
                                            value={newItem.name}
                                            onChange={(e) => setNewItem({...newItem, name: e.target.value})}
                                            placeholder="e.g., Spitfire Stamp"
                                            style={{
                                                width: '100%',
                                                padding: '0.75rem',
                                                border: '2px solid #ddd',
                                                borderRadius: '8px',
                                                fontSize: '1rem'
                                            }}
                                        />
                                    </div>
                                    
                                    <div>
                                        <label style={{display: 'block', marginBottom: '0.5rem', fontWeight: '600', color: '#555'}}>
                                            Category *
                                        </label>
                                        <select
                                            value={newItem.category}
                                            onChange={(e) => setNewItem({...newItem, category: e.target.value})}
                                            style={{
                                                width: '100%',
                                                padding: '0.75rem',
                                                border: '2px solid #ddd',
                                                borderRadius: '8px',
                                                fontSize: '1rem',
                                                background: 'white',
                                                cursor: 'pointer'
                                            }}
                                        >
                                            <option value="">-- Select Category --</option>
                                            {uniqueCategories.map(category => (
                                                <option key={category} value={category}>
                                                    {category}
                                                </option>
                                            ))}
                                        </select>
                                        <div style={{ marginTop: '0.25rem', fontSize: '0.8rem', color: '#666' }}>
                                            {uniqueCategories.length > 0 ? `${uniqueCategories.length} categories in use` : 'Categories from your inventory'}
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <label style={{display: 'block', marginBottom: '0.5rem', fontWeight: '600', color: '#555'}}>
                                            Location
                                        </label>
                                        <input
                                            type="text"
                                            value={newItem.location}
                                            onChange={(e) => setNewItem({...newItem, location: e.target.value})}
                                            placeholder="e.g., A-1 or B-2"
                                            style={{
                                                width: '100%',
                                                padding: '0.75rem',
                                                border: '2px solid #ddd',
                                                borderRadius: '8px',
                                                fontSize: '1rem'
                                            }}
                                        />
                                        <div style={{ marginTop: '0.25rem', fontSize: '0.8rem', color: '#666' }}>
                                            Optional - Format: Zone-Shelf (e.g., A-1, B-2, C-3)
                                        </div>
                                    </div>
                                    
                                    <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem'}}>
                                        <div>
                                            <label style={{display: 'block', marginBottom: '0.5rem', fontWeight: '600', color: '#555'}}>
                                                Quantity in Shop
                                            </label>
                                            <input
                                                type="number"
                                                value={newItem.quantityShop}
                                                onChange={(e) => setNewItem({...newItem, quantityShop: parseInt(e.target.value) || 0})}
                                                min="0"
                                                style={{
                                                    width: '100%',
                                                    padding: '0.75rem',
                                                    border: '2px solid #ddd',
                                                    borderRadius: '8px',
                                                    fontSize: '1rem'
                                                }}
                                            />
                                        </div>
                                        
                                        <div>
                                            <label style={{display: 'block', marginBottom: '0.5rem', fontWeight: '600', color: '#555'}}>
                                                Quantity in Storage
                                            </label>
                                            <input
                                                type="number"
                                                value={newItem.quantityStore}
                                                onChange={(e) => setNewItem({...newItem, quantityStore: parseInt(e.target.value) || 0})}
                                                min="0"
                                                style={{
                                                    width: '100%',
                                                    padding: '0.75rem',
                                                    border: '2px solid #ddd',
                                                    borderRadius: '8px',
                                                    fontSize: '1rem'
                                                }}
                                            />
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <label style={{display: 'block', marginBottom: '0.5rem', fontWeight: '600', color: '#555'}}>
                                            Supplier
                                        </label>
                                        <select
                                            value={newItem.supplier}
                                            onChange={(e) => setNewItem({...newItem, supplier: e.target.value})}
                                            style={{
                                                width: '100%',
                                                padding: '0.75rem',
                                                border: '2px solid #ddd',
                                                borderRadius: '8px',
                                                fontSize: '1rem',
                                                background: 'white',
                                                cursor: 'pointer'
                                            }}
                                        >
                                            <option value="">-- Select Supplier --</option>
                                            {uniqueSuppliers.filter(s => s !== 'TBD').map(supplier => (
                                                <option key={supplier} value={supplier}>
                                                    {supplier}
                                                </option>
                                            ))}
                                            <option value="TBD">TBD (Set Later)</option>
                                        </select>
                                        <div style={{ marginTop: '0.25rem', fontSize: '0.8rem', color: '#666' }}>
                                            {uniqueSuppliers.filter(s => s !== 'TBD').length > 0 ? `${uniqueSuppliers.filter(s => s !== 'TBD').length} suppliers in use` : 'Suppliers from your inventory'}
                                        </div>
                                    </div>
                                </div>
                                
                                <div style={{display: 'flex', gap: '1rem', marginTop: '2rem'}}>
                                    <button
                                        onClick={async () => {
                                            if (!newItem.name.trim()) {
                                                alert('Please enter an item name');
                                                return;
                                            }
                                            
                                            // NEW V4.9.1 - Check for duplicate items
                                            const normalizedName = newItem.name.trim().toLowerCase();
                                            const duplicate = items.find(item => 
                                                item.name.toLowerCase() === normalizedName
                                            );
                                            
                                            if (duplicate) {
                                                if (!confirm(`⚠️ An item named "${duplicate.name}" already exists.\n\nDo you want to add this item anyway?`)) {
                                                    return;
                                                }
                                            }
                                            
                                            // NEW V3.4.3.1 - Aggressive category normalization
                                            let normalizedCategory = (newItem.category || '').trim();
                                            normalizedCategory = normalizedCategory.replace(/\s+/g, ' ');
                                            normalizedCategory = normalizedCategory.replace(/[\u200B-\u200D\uFEFF]/g, '');
                                            if (normalizedCategory.normalize) normalizedCategory = normalizedCategory.normalize('NFC');
                                            
                                            const itemToAdd = {
                                                ...newItem,
                                                name: newItem.name.trim(),
                                                category: normalizedCategory,
                                                quantity: newItem.quantityShop + newItem.quantityStore,
                                                lastRestocked: new Date().toISOString().split('T')[0]
                                            };
                                            
                                            const success = await saveItemToFirebase(itemToAdd);
                                            
                                            if (success) {
                                                setShowAddItemModal(false);
                                                await logActivity('item_create', `Created new item: ${newItem.name.trim()}`, { itemName: newItem.name.trim(), category: newItem.category });
                                                setNewItem({
                                                    name: '',
                                                    category: 'General',
                                                    location: '',
                                                    quantityShop: 0,
                                                    quantityStore: 0,
                                                    minStock: 5,
                                                    reorderPoint: 0,
                                                    supplier: 'TBD',
                                                    notes: []
                                                });
                                                alert('✅ Item added successfully!');
                                            }
                                        }}
                                        style={{
                                            flex: 1,
                                            padding: '1rem',
                                            background: '#4caf50',
                                            color: 'white',
                                            border: 'none',
                                            borderRadius: '8px',
                                            fontSize: '1rem',
                                            fontWeight: '600',
                                            cursor: 'pointer'
                                        }}
                                    >
                                        ✅ Add Item
                                    </button>
                                    
                                    <button
                                        onClick={() => {
                                            setShowAddItemModal(false);
                                            setNewItem({
                                                name: '',
                                                category: 'General',
                                                location: '',
                                                quantityShop: 0,
                                                quantityStore: 0,
                                                minStock: 5,
                                                reorderPoint: 0,
                                                supplier: 'TBD',
                                                notes: []
                                            });
                                        }}
                                        style={{
                                            flex: 1,
                                            padding: '1rem',
                                            background: '#f44336',
                                            color: 'white',
                                            border: 'none',
                                            borderRadius: '8px',
                                            fontSize: '1rem',
                                            fontWeight: '600',
                                            cursor: 'pointer'
                                        }}
                                    >
                                        ❌ Cancel
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
