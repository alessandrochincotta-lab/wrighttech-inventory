<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tunnels App">
    <meta name="theme-color" content="#1a1a1a">
    <title>Tunnels App</title>

    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --black: #1c1c1e;
    --surface: #242426;
    --card-bg: #2c2c2e;
    --border: rgba(255,255,255,0.1);
    --text: #f0ede8;
    --muted: #888;
    --accent: #c8a96e;
    --accent-dim: rgba(200,169,110,0.15);
    --green: #4caf50;
    --orange: #ff9800;
    --blue: #42a5f5;
    --red: #ef5350;
}

html, body { height: 100%; background: var(--black); font-family: 'DM Sans', sans-serif; color: var(--text); overflow-x: hidden; }

/* ── Auth ── */
#auth-screen {
    position: fixed; inset: 0; background: var(--black);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem; z-index: 100; transition: opacity 0.5s ease;
}
#auth-screen.hidden { opacity: 0; pointer-events: none; }

.auth-logo-wrap {
    width: 100px; height: 100px; margin-bottom: 2rem;
    border-radius: 20px; overflow: hidden;
    background: transparent;
    animation: fadeUp 0.7s ease both;
}
.auth-logo-wrap img {
    width: 100%; height: 100%;
    object-fit: contain;
    filter: invert(1) brightness(2);
    mix-blend-mode: screen;
}

.auth-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem; letter-spacing: 0.18em;
    color: var(--text); line-height: 1;
    margin-bottom: 0.2rem;
    animation: fadeUp 0.7s 0.08s ease both;
}
.auth-sub {
    font-size: 0.72rem; color: var(--muted);
    letter-spacing: 0.25em; text-transform: uppercase;
    margin-bottom: 3rem;
    animation: fadeUp 0.7s 0.14s ease both;
}
.auth-form { width: 100%; max-width: 280px; animation: fadeUp 0.7s 0.2s ease both; }
.auth-input {
    width: 100%; padding: 0.9rem 1.1rem;
    background: #1e1e1e; border: 1px solid #2e2e2e;
    border-radius: 10px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 1rem;
    letter-spacing: 0.2em; text-align: center;
    margin-bottom: 0.65rem; outline: none;
    transition: border-color 0.2s;
}
.auth-input:focus { border-color: var(--accent); }
.auth-input.error { border-color: var(--red); animation: shake 0.3s ease; }
.auth-btn {
    width: 100%; padding: 0.85rem;
    background: var(--accent); color: var(--black);
    border: none; border-radius: 10px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.05rem; letter-spacing: 0.2em;
    cursor: pointer; transition: background 0.2s, transform 0.1s;
}
.auth-btn:hover { background: #d4b87a; }
.auth-btn:active { transform: scale(0.98); }
.auth-error { text-align: center; color: var(--red); font-size: 0.8rem; margin-top: 0.5rem; min-height: 1em; }

/* ── App ── */
#app { min-height: 100vh; background: var(--black); display: none; flex-direction: column; }
#app.visible { display: flex; }

/* Header */
.app-header {
    background: var(--black);
    padding: 1rem 1.25rem 0.85rem;
    padding-top: max(1rem, env(safe-area-inset-top));
    display: flex; align-items: center; gap: 0.85rem;
    border-bottom: 1px solid var(--border);
}
.header-logo {
    width: 30px; height: 30px; flex-shrink: 0;
    filter: invert(1) brightness(2);
    mix-blend-mode: screen; opacity: 0.85;
}
.header-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem; letter-spacing: 0.15em; color: var(--text); flex: 1;
}
.header-right { text-align: right; }
.header-time { font-size: 0.88rem; color: var(--text); font-weight: 500; }
.header-date { font-size: 0.68rem; color: var(--muted); margin-top: 1px; }

/* Status bar */
.status-bar {
    padding: 0.45rem 1.25rem;
    background: #161618;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
}
.status-live { display: flex; align-items: center; gap: 0.4rem; font-size: 0.7rem; color: var(--muted); }
.status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); }
.status-updated { font-size: 0.7rem; color: #444; }

/* Grid */
.app-grid { flex: 1; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }

/* Primary row - full width cards */
.grid-row-primary { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
/* Secondary row - smaller cards */
.grid-row-secondary { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

/* App cards */
.app-card {
    background: var(--card-bg);
    border-radius: 16px;
    border: 1px solid var(--border);
    cursor: pointer; position: relative; overflow: hidden;
    transition: transform 0.15s, border-color 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}
.app-card:active { transform: scale(0.97); }

/* Subtle texture overlay */
.app-card::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at top right, rgba(255,255,255,0.03) 0%, transparent 60%);
    pointer-events: none;
}

/* Accent line top */
.app-card::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    background: var(--card-accent, rgba(255,255,255,0.08));
    border-radius: 16px 16px 0 0;
}

/* Primary card layout */
.app-card.primary { padding: 1.25rem; }
.app-card.secondary { padding: 1rem; }

/* Watermark icon */
.card-watermark {
    position: absolute; bottom: -8px; right: -4px;
    font-size: 4.5rem; opacity: 0.12; pointer-events: none;
    line-height: 1; transform: rotate(-5deg);
}
.app-card.secondary .card-watermark { font-size: 3.5rem; opacity: 0.12; }

.card-icon { font-size: 1.5rem; display: block; margin-bottom: 0.5rem; }
.app-card.secondary .card-icon { font-size: 1.25rem; margin-bottom: 0.35rem; }

.card-name {
    font-weight: 700; font-size: 1rem; color: var(--text);
    margin-bottom: 0.2rem;
}
.app-card.secondary .card-name { font-size: 0.88rem; }

.card-desc { font-size: 0.72rem; color: var(--muted); line-height: 1.4; margin-bottom: 0.75rem; }
.app-card.secondary .card-desc { font-size: 0.68rem; margin-bottom: 0.5rem; }

.card-badge {
    display: inline-flex; align-items: center; gap: 0.3rem;
    padding: 3px 9px; border-radius: 20px;
    font-size: 0.7rem; font-weight: 700;
    background: var(--badge-bg, rgba(255,255,255,0.07));
    color: var(--badge-color, var(--muted));
}
.card-badge.loading { color: #444; animation: pulse 1.5s infinite; }

.card-arrow {
    position: absolute; bottom: 0.85rem; right: 0.85rem;
    color: rgba(255,255,255,0.1); font-size: 0.8rem;
    transition: color 0.15s, transform 0.15s;
}
.app-card:hover .card-arrow { color: rgba(255,255,255,0.25); transform: translateX(2px); }

/* Frame */
#app-frame-container {
    position: fixed; inset: 0; background: white;
    z-index: 50; display: none; flex-direction: column;
}
#app-frame-container.visible { display: flex; }

.frame-topbar {
    background: var(--black);
    padding: 0.6rem 1rem;
    padding-top: max(0.6rem, env(safe-area-inset-top));
    display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0;
}
.frame-back {
    display: flex; align-items: center; gap: 0.4rem;
    background: #1e1e1e; border: 1px solid #2e2e2e;
    color: var(--text); padding: 0.4rem 0.9rem;
    border-radius: 7px; font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem; font-weight: 600;
    cursor: pointer; transition: border-color 0.2s;
    flex-shrink: 0;
}
.frame-back:hover { border-color: var(--accent); }
.frame-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem; letter-spacing: 0.12em; color: var(--text); flex: 1;
}
#app-iframe { flex: 1; border: none; width: 100%; }

/* Footer */
.app-footer {
    padding: 0.75rem 1.25rem;
    padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    text-align: center; border-top: 1px solid var(--border);
}
.footer-text { font-size: 0.65rem; color: #333; letter-spacing: 0.08em; text-transform: uppercase; }

/* Animations */
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
}
@keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.8; }
}
.card-enter { animation: fadeUp 0.5s ease both; }
.app-card:nth-child(1) { animation-delay: 0.04s; }
.app-card:nth-child(2) { animation-delay: 0.08s; }
.app-card:nth-child(3) { animation-delay: 0.12s; }
.app-card:nth-child(4) { animation-delay: 0.16s; }
</style>
</head>

            <div class="app-card primary card-enter" style="--card-accent: #8d6e63" onclick="openApp('artifacts')">

                <div class="card-name">Artifacts</div>
                <div class="card-desc">WWII Tunnels catalog</div>
                <div class="card-badge" id="badge-artifacts" style="--badge-bg: rgba(141,110,99,0.2); --badge-color: #a1887f">127 items</div>

        <!-- Secondary row: Bar + Deliveries -->
        <div class="grid-row-secondary">
            <div class="app-card secondary card-enter" style="--card-accent: var(--accent)" onclick="openApp('bar')">
                <span class="card-watermark">🍺</span>
                <span class="card-icon">🍺</span>
                <div class="card-name">Bar Stock</div>
                <div class="card-desc">Tunneller's Rest</div>
                <div class="card-badge loading" id="badge-bar">...</div>
                <div class="card-arrow">→</div>
            </div>
            <div class="app-card secondary card-enter" style="--card-accent: #4caf50" onclick="openApp('deliveries')">
                <span class="card-watermark">🚚</span>
                <span class="card-icon">🚚</span>
                <div class="card-name">Deliveries</div>
                <div class="card-desc">Receive stock</div>

<!-- Frame -->
<div id="app-frame-container">
    <div class="frame-topbar">
        <button class="frame-back" onclick="closeApp()">← Home</button>
        <span id="frame-icon" style="font-size:1.1rem"></span>
        <span class="frame-title" id="frame-title"></span>
    </div>
    <iframe id="app-iframe" src="" allow="camera; microphone"></iframe>
</div>

<script>
    const firebaseConfig = {
            apiKey: "AIzaSyCWvAkAfDCkljNQmTyQsrhES7pm4H751EQ",
            authDomain: "wrighttech-inventory.firebaseapp.com",
            projectId: "wrighttech-inventory",
            storageBucket: "wrighttech-inventory.firebasestorage.app",
            messagingSenderId: "891021456690",
            appId: "1:891021456690:web:e81d5b7ff36dd3f687532b"
        };

    const HASH = '092a52f290f37f0c24b6ad1ba4ec1bfb85f7937a62af13382ef373ac4ef9d252';
    const AUTH_KEY = 'tunnels_app_auth_v2';

    async function sha256(str) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    async function checkAuth() {
        const val = document.getElementById('auth-input').value;
        const hash = await sha256(val);
        if (hash === HASH) {
            localStorage.setItem(AUTH_KEY, '1');
            document.getElementById('auth-screen').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app').classList.add('visible');
                initApp();
            }, 500);
        } else {
            const inp = document.getElementById('auth-input');
            inp.classList.add('error');
            document.getElementById('auth-error').textContent = 'Incorrect password';
            setTimeout(() => { inp.classList.remove('error'); inp.value = ''; }, 600);
        }
    }

    document.getElementById('auth-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkAuth(); });

    if (localStorage.getItem(AUTH_KEY)) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app').classList.add('visible');
        initApp();
    }

    const APPS = {
        inventory:  { name: 'Inventory',  icon: '📦', url: 'wrighttech-inventory-V1.1.html' },
        bar:        { name: 'Bar Stock',  icon: '🍺', url: 'tunnellers-bar-inventory.html' },
        deliveries: { name: 'Deliveries', icon: '🚚', url: 'wrighttech-deliveries.html' },
        artifacts:  { name: 'Artifacts',  icon: '🏺', url: 'https://alessandrochincotta-lab.github.io/WWII-Tunnels-Artefacts/artifactsFinal.html' }
    };

    function openApp(key) {
        const app = APPS[key];
        if (!app) return;
        document.getElementById('frame-title').textContent = app.name;
        document.getElementById('frame-icon').textContent = app.icon;
        document.getElementById('app-iframe').src = app.url;
        document.getElementById('app-frame-container').classList.add('visible');
        history.pushState({ app: key }, '', '#' + key);
    }

    function closeApp() {
        document.getElementById('app-frame-container').classList.remove('visible');
        document.getElementById('app-iframe').src = '';
        history.pushState({}, '', window.location.pathname);
        loadBadges();
    }

    window.addEventListener('popstate', e => { if (!e.state || !e.state.app) closeApp(); });

    function updateClock() {
        const now = new Date();
        document.getElementById('header-time').textContent = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('header-date').textContent = now.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function setBadge(id, text, bg, color) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = text;
        el.className = 'card-badge';
        el.style.setProperty('--badge-bg', bg);
        el.style.setProperty('--badge-color', color);
    }

    let db;

    function loadBadges() {
        if (!db) return;

        // Inventory — suppliers with items ready to order (from smartOrderSuggestions logic)
        // Read items + salesHistory to estimate, or just count reorderList pending
        db.collection('reorderList').get().then(snap => {
            const ordered = snap.docs.filter(d => d.data().orderStatus === 'ordered').length;
            const pending = snap.docs.filter(d => !d.data().orderStatus || d.data().orderStatus === 'pending').length;
            // Get unique suppliers from ordered items
            const orderedSuppliers = new Set(snap.docs.filter(d => d.data().orderStatus === 'ordered').map(d => d.data().supplier).filter(Boolean));
            if (orderedSuppliers.size > 0) {
                setBadge('badge-inventory', orderedSuppliers.size + ' supplier' + (orderedSuppliers.size !== 1 ? 's' : '') + ' ordered', 'rgba(255,152,0,0.15)', '#ff9800');
            } else if (pending > 0) {
                setBadge('badge-inventory', pending + ' to order', 'rgba(255,193,7,0.12)', '#ffc107');
            } else {
                setBadge('badge-inventory', 'All clear', 'rgba(76,175,80,0.12)', '#4caf50');
            }
        }).catch(() => setBadge('badge-inventory', '—', 'rgba(255,255,255,0.05)', '#444'));

        // Bar — low stock
        db.collection('barInventory').get().then(snap => {
            const low = snap.docs.filter(d => {
                const data = d.data();
                return (data.quantity || 0) <= (data.lowStockLevel || 3);
            }).length;
            if (low > 0) {
                setBadge('badge-bar', low + ' low stock', 'rgba(239,83,80,0.15)', '#ef5350');
            } else {
                setBadge('badge-bar', 'Stocked up', 'rgba(76,175,80,0.12)', '#4caf50');
            }
        }).catch(() => setBadge('badge-bar', '—', 'rgba(255,255,255,0.05)', '#444'));

        // Deliveries — items awaiting delivery
        db.collection('reorderList').where('orderStatus', '==', 'ordered').get().then(snap => {
            if (snap.size > 0) {
                setBadge('badge-deliveries', snap.size + ' awaiting', 'rgba(66,165,245,0.15)', '#42a5f5');
            } else {
                setBadge('badge-deliveries', 'Nothing pending', 'rgba(76,175,80,0.12)', '#4caf50');
            }
        }).catch(() => setBadge('badge-deliveries', '—', 'rgba(255,255,255,0.05)', '#444'));

        document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }

    function initApp() {
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            loadBadges();
            setInterval(loadBadges, 120000);
        } catch(e) { console.error('Firebase:', e); }
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
</script>
